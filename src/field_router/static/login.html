<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffc800"><title>Вход · Выездная служба</title><link rel="stylesheet" href="/auth.css"><script src="/login.js" defer></script><link rel="stylesheet" href="/brand.css">
<link rel="icon" type="image/svg+xml" href="/assets/beeline-symbol.svg">
</head>
<body class="login-page"><main class="login-card">
<a class="auth-brand" href="/login"><img class="brand-logo" src="/assets/beeline-logo.png" alt="билайн" width="132" height="26"><small>Выездная служба</small></a>
<h1>Вход в рабочий кабинет</h1>
<p class="muted">Задания, маршруты и команда в одном месте.</p>
<form id="login-form"><label for="username">Логин</label><input id="username" name="username" autocomplete="username" maxlength="64" required autofocus>
<label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
<label class="check"><input type="checkbox" id="show-password"> Показать пароль</label>
<p id="login-error" role="alert" hidden></p><button id="login-submit" type="submit">Войти</button></form>
<p class="muted small">Учётную запись инженера выдаёт диспетчер. Если забыли пароль, обратитесь к нему.</p>
</main></body></html>
