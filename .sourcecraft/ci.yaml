on:
  push:
    - workflows: [release]
      filter:
        branches: [main]
  pull_request:
    - workflows: [checks]
      filter:
        target_branches: [main]

workflows:
  checks:
    tasks:
      - test-and-package
  release:
    tasks:
      - test-and-package
      - name: deploy-render
        needs: [test-and-package]
        cubes:
          - name: publish-tested-image
            env:
              DOCKERHUB_PUSH_TOKEN: ${{ secrets.DOCKERHUB_PUSH_TOKEN }}
              RENDER_TRIGGER: dockerhub
            script:
              - python3 scripts/deploy_render.py

tasks:
  - name: test-and-package
    cubes:
      - name: verify
        # Explicit official registry avoids SourceCraft's Docker Hub mirror,
        # which can time out before the verification script starts.
        image: public.ecr.aws/docker/library/python:3.11-bookworm
        script:
          - |
            set -eu
            apt-get update -qq
            apt-get install -y --no-install-recommends nodejs
            python -m pip install -r requirements.lock
            python -m pip install --no-deps -e .
            sh scripts/check.sh
        artifacts:
          paths:
            - test-results.xml
            - dist/
