on:
  push:
    - workflows: [checks]
      filter:
        branches: [main]
  pull_request:
    - workflows: [checks]
      filter:
        target_branches: [main]

workflows:
  checks:
    tasks:
      - name: test-and-package
        cubes:
          - name: verify
            image: python:3.11-bookworm
            script:
              - |
                set -eu
                apt-get update -qq
                apt-get install -y --no-install-recommends nodejs
                python -m pip install -r requirements.lock
                python -m pip install --no-deps -e .
                sh scripts/check.sh
            artifacts:
              paths:
                - test-results.xml
                - dist/
